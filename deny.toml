# Dependency policy checked in CI with `cargo deny check`.
# Only permissive licenses, so the shipped app can stay MIT OR Apache-2.0.

[graph]
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Public domain dedication (notify, for folder watching).
    "CC0-1.0",
]
confidence-threshold = 0.9
# Allowed ahead of time; not every allowed license is in use yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # chrono is no longer maintained, and has no safe upgrade. It comes in
    # through suppaftp (FTP), which uses it for file dates (in listings
    # and MDTM). Remove this once suppaftp moves to jiff or time.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (no fix); suppaftp uses it for file dates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
