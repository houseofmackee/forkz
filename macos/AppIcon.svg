<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F8F83"/>
      <stop offset="1" stop-color="#1C5D73"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEF1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2A33" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 x 824 body inside the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="196" y="250" width="292" height="524" rx="40" fill="url(#pane)"/>
    <rect x="536" y="250" width="292" height="524" rx="40" fill="url(#pane)"/>
  </g>
  <g fill="#9DB9C2">
    <rect x="236" y="310" width="212" height="34" rx="17"/>
    <rect x="236" y="374" width="172" height="34" rx="17"/>
    <rect x="236" y="438" width="196" height="34" rx="17"/>
    <rect x="576" y="310" width="212" height="34" rx="17"/>
    <rect x="576" y="374" width="150" height="34" rx="17"/>
  </g>
  <!-- the fork: one path splitting toward both panes -->
  <g fill="none" stroke="#F2B544" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 720 V600 C512 540 470 520 400 520"/>
    <path d="M512 600 C512 540 554 520 640 520"/>
  </g>
  <g fill="#F2B544">
    <path d="M380 470 L310 520 L380 570 Z"/>
    <path d="M644 470 L714 520 L644 570 Z"/>
  </g>
</svg>
